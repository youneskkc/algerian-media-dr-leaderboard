name: نشر صفحة الترتيب

on:
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'data/ratings.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: إعداد Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: تجهيز ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: نشر GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
